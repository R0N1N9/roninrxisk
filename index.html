<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoninRxisk</title>
<meta name="description" content="RoninRxisk: Research efforts, education, and safety practices for people who show up for their communities and the causes they believe in. A RoninSec brand. Coming soon.">
<meta name="theme-color" content="#121412">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23B03A36'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Zen+Antique&display=swap">
<style>
/* Holding page: one centered column on matte black. Shares the RoninSec palette; RoninRxisk's own accent. */
:root {
  color-scheme: dark;
  --paper: #121412; --paper-2: #1C1F1E; --ink: #DAD6CA; --ink-2: #9A978A; --rule: #2D3230;
  --accent: #B03A36; --red: #B03A36;
  --f-display: "Zen Antique", "Hiragino Mincho ProN", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
  display: grid; grid-template-rows: 1fr auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.mono { font-family: var(--f-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; }
main { align-self: center; width: 100%; max-width: 44rem; margin-inline: auto; padding-block: 64px; display: grid; gap: 22px; }
.kicker { color: var(--accent); display: flex; align-items: center; gap: 10px; margin: 0; }
.kicker::before { content: ""; width: 28px; height: 1px; background: var(--accent); }
h1 { font: 400 clamp(3rem, 11vw, 6rem)/1 var(--f-display); margin: 0; letter-spacing: .005em; text-wrap: balance; }
h1 em { font-style: normal; color: var(--accent); }
p.line { margin: 0; color: var(--ink-2); font-size: 1.15rem; max-width: 34rem; }
.status { justify-self: start; padding: .3rem .6rem; border: 1px solid var(--red); color: var(--red); border-radius: 2px; }
.back { justify-self: start; text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 2px; font-weight: 500; }
.back:hover { color: var(--accent); }
.jp { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--rule); color: var(--ink-2); display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.jp b { font: 400 1.6rem/1 var(--f-display); color: var(--ink); }
footer { border-top: 1px solid var(--rule); padding-block: 22px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; color: var(--ink-2); max-width: 72rem; width: 100%; margin-inline: auto; }
</style>
</head>
<body>
<main>
  <p class="kicker mono">Activism · Advocacy</p>
  <h1>Ronin<em>Rxisk</em></h1>
  <p class="line">Research efforts, education, and safety practices for people who show up for their communities and the causes they believe in.</p>
  <span class="status mono">Coming soon</span>
  <a class="back" href="https://r0n1n9.github.io/roninsec/">Back to RoninSec <span aria-hidden="true">→</span></a>
  <div class="jp"><b lang="ja">浪人</b><span class="mono">Masterless, never indifferent</span></div>
</main>
<footer>
  <span class="mono">© 2026 RoninRxisk</span>
  <a class="mono" href="https://r0n1n9.github.io/roninsec/" style="text-decoration:none">A RoninSec brand</a>
</footer>
</body>
</html>
